# ================================
# ARCHITECTURE & SECURITY
# ================================
# Dos comprobaciones que antes solo existían en revisión:
#
# 1. Contratos de arquitectura (dependency-cruiser, ver .dependency-cruiser.cjs):
#    dominio puro y sin frameworks, casos de uso que solo dependen del dominio,
#    infraestructura que no sube de capa, interfaz que pasa por src/composition,
#    y sin dependencias circulares. El control de que nadie llama a fetch
#    saltándose apiRequest() vive en ESLint (eslint.config.js).
# 2. OWASP Top 10 con Semgrep (reglas p/owasp-top-ten, p/react, p/javascript):
#    eval con datos externos, redirecciones abiertas, dangerouslySetInnerHTML...
#    El 28 sep 2026 el código estaba limpio, así que cualquier aviso nuevo bloquea.
#    Los resultados van también a la pestaña Security. Complementa a CodeQL.

name: Architecture & Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  architecture:
    name: 🏛️ Architecture Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # Mismo motivo que en ci-cd.yml: npm 10 falla npm ci con ERESOLVE en peers opcionales
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check architecture contracts
        run: npm run lint:architecture

  semgrep:
    name: 🛡️ OWASP (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Subida del SARIF a la pestaña Security
    env:
      SEMGREP_VERSION: '1.178.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Scan (OWASP Top 10, React, JavaScript)
        run: |
          semgrep scan \
            --config p/owasp-top-ten --config p/react --config p/javascript \
            --metrics off --error \
            --sarif-output=semgrep.sarif \
            src

      - name: Upload results to the Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
