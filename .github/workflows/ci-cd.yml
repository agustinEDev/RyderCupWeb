name: CI/CD & Security Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]
  schedule:
    # Run security checks every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ========================================
  # PHASE 1: SECURITY CHECKS (CRITICAL)
  # ========================================

  commit-verification:
    name: 🔏 Signed commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # la lista de commits de la PR
    steps:
      - name: Checkout the script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Todos los commits de la PR (o del push), verificados por GitHub. Antes se
      # miraba HEAD, que en una PR es el merge que firma GitHub: un commit sin
      # firmar en la rama pasaba (la PR #80 tiene uno), y sin el secreto de las
      # claves salía en verde sin mirar nada (ver el script)
      - name: Verify every commit is signed
        id: firmas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) bash .github/scripts/verify-signed-commits.sh pr "$PR_NUMBER" ;;
            push) bash .github/scripts/verify-signed-commits.sh range "$BEFORE" "$AFTER" ;;
            schedule) echo "El escaneo semanal no trae commits nuevos: nada que verificar" ;;
            # Un disparador nuevo (merge_group, workflow_dispatch...) no pasa sin mirar
            *) echo "::error::Evento '$EVENT' sin verificación de firmas definida"; exit 2 ;;
          esac

      # Al final de cada job, su tarjeta en el resumen de la ejecución: qué
      # comprueba y qué ha salido, con los números de la propia herramienta
      # (.github/scripts/summary_results.py los lee; summary_card.py la escribe)
      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.firmas.outcome }}
          EVENT: ${{ github.event_name }}
          VERIFIED: ${{ steps.firmas.outputs.verified }}
          UNSIGNED: ${{ steps.firmas.outputs.unsigned }}
          TOTAL: ${{ steps.firmas.outputs.total }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py commits outcome="$OUTCOME" event="$EVENT" \
            verified="$VERIFIED" unsigned="$UNSIGNED" total="$TOTAL")
          python3 .github/scripts/summary_card.py \
            --title "🔏 Signed commits" \
            --what "Every commit of the PR (or push) must carry a signature that GitHub has verified, so nobody can push code under someone else's name." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Sign the commits with 'git commit -S' (or rebase with --exec 'git commit --amend --no-edit -S') and push again."

  dependency-audit:
    name: 🔒 npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      moderate: ${{ steps.audit.outputs.moderate }}
      total: ${{ steps.audit.outputs.total }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Verify package-lock.json integrity
        run: |
          echo "🔒 Verifying package-lock.json was not modified..."

          git diff --exit-code package-lock.json || {
            echo "❌ package-lock.json was modified during npm ci!"
            echo "Run 'npm install' locally and commit the updated package-lock.json."
            exit 1
          }

          echo "✅ package-lock.json integrity verified"

      - name: Run npm audit
        id: audit
        run: |
          # npm audit sale con 1 si encuentra algo: decide la puerta, que también
          # falla si el informe no trae el recuento (un registro caído no es un
          # aprobado). Ver .github/scripts/npm-audit-gate.sh
          npm audit --json > audit-report.json || true
          set +e
          bash .github/scripts/npm-audit-gate.sh audit-report.json
          PUERTA=$?
          set -e
          if [ "$PUERTA" -ne 0 ]; then
            # 1: altas o críticas · 2: no se pudo auditar (registro caído)
            [ "$PUERTA" -eq 1 ] && { npm audit --audit-level=moderate || true; }  # el detalle
            exit "$PUERTA"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.audit.outcome }}
          CRITICAL: ${{ steps.audit.outputs.critical }}
          HIGH: ${{ steps.audit.outputs.high }}
          MODERATE: ${{ steps.audit.outputs.moderate }}
          TOTAL: ${{ steps.audit.outputs.total }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py audit outcome="$OUTCOME" \
            critical="$CRITICAL" high="$HIGH" moderate="$MODERATE" total="$TOTAL")
          python3 .github/scripts/summary_card.py \
            --title "🔒 npm audit" \
            --what "Checks every installed npm package against the known-vulnerability database, after confirming npm ci left package-lock.json untouched. Critical and high block; moderate only warns." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Run 'npm audit' locally, then 'npm audit fix' or add an override in package.json. If the lockfile changed, run 'npm install' and commit it."

  secret-scanning:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (Filesystem Scan)
        id: trufflehog
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          extra_args: --debug --only-verified

      # La acción no deja su salida a los pasos siguientes: la tarjeta dice el
      # resultado y qué se ha escaneado, y el recuento queda en el log
      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.trufflehog.outcome }}
          EVENT: ${{ github.event_name }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py secrets outcome="$OUTCOME" event="$EVENT")
          python3 .github/scripts/summary_card.py \
            --title "🔐 Secret Scanning" \
            --what "TruffleHog looks for credentials (API keys, tokens, passwords) in the new commits and only reports the ones it can verify are live, so a leaked secret is caught before it reaches main." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Revoke the secret at its provider first (it is already in git history), then remove it from the code and load it from the environment."

  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        id: licenses
        run: |
          echo "📜 Checking dependency licenses..."
          npx license-checker --json --out licenses.json

          # Check for problematic licenses
          FORBIDDEN_LICENSES="GPL-3.0 AGPL-3.0 LGPL-3.0"

          for license in $FORBIDDEN_LICENSES; do
            if npx license-checker --summary | grep -q "$license"; then
              echo "forbidden=$license" >> "$GITHUB_OUTPUT"  # para la tarjeta
              echo "❌ Forbidden license found: $license"
              npx license-checker --summary
              exit 1
            fi
          done

          echo "✅ All licenses are compliant"
          npx license-checker --summary

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.licenses.outcome }}
          FORBIDDEN: ${{ steps.licenses.outputs.forbidden }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py licenses outcome="$OUTCOME" \
            report=licenses.json forbidden="$FORBIDDEN")
          python3 .github/scripts/summary_card.py \
            --title "📜 License Compliance" \
            --what "Reads the licence of every installed npm package and fails on GPL-3.0, AGPL-3.0 or LGPL-3.0, whose copyleft terms the project cannot accept." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Replace the package with one under a permissive licence (MIT, Apache-2.0, BSD, ISC); the full list is in the license-report artifact."

  # Sustituye a Snyk (cuota agotada desde hace meses): bloquea la PR que AÑADE
  # o sube una dependencia con una vulnerabilidad conocida de gravedad moderada
  # o más. Lo que ya está en develop lo vigilan las alertas de Dependabot y npm audit.
  dependency-review:
    name: 🔎 Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

      # En un push el job entero se salta y no hay tarjeta: el índice del
      # Pipeline Summary lo marca como saltado
      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.review.outcome }}
          CHANGES: ${{ steps.review.outputs.dependency-changes }}
          VULNERABLE: ${{ steps.review.outputs.vulnerable-changes }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py dependency-review outcome="$OUTCOME" \
            changes="$CHANGES" vulnerable="$VULNERABLE")
          python3 .github/scripts/summary_card.py \
            --title "🔎 Dependency Review" \
            --what "On pull requests only: compares the dependencies before and after the PR and fails if it adds or upgrades to a version with a known vulnerability of moderate severity or worse." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Pick a patched version of the dependency (the action's own summary above lists the advisory), or drop the change."

  outdated-dependencies:
    name: 📦 Outdated deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated packages
        id: outdated
        run: |
          echo "📦 Checking for outdated dependencies..."
          npm outdated --json > outdated.json || true

          # Count outdated packages
          OUTDATED_COUNT=$(cat outdated.json | jq 'length')

          echo "📊 Found $OUTDATED_COUNT outdated packages"
          echo "count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT

          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "⚠️ Outdated packages found (informational only, does not fail CI):"
            npm outdated || true
          else
            echo "✅ All packages are up to date"
          fi

      - name: Upload outdated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outdated-dependencies
          path: outdated.json
          retention-days: 30

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.outdated.outcome }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py outdated outcome="$OUTCOME" report=outdated.json)
          python3 .github/scripts/summary_card.py \
            --title "📦 Outdated deps" \
            --what "Lists the npm packages that have a newer release than the installed one. Informational only: it keeps upgrades visible but never blocks." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Only fails if npm itself breaks (install or a malformed report); see the step log."

  # OWASP Top 10 con Semgrep (p/owasp-top-ten, p/react, p/javascript): eval con
  # datos externos, redirecciones abiertas, dangerouslySetInnerHTML... Bloquea con
  # cualquier aviso (el 28 sep 2026 el código estaba limpio) y sube el SARIF a la
  # pestaña Security. Complementa a CodeQL.
  owasp-semgrep:
    name: 🛡️ OWASP (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Subida del SARIF a la pestaña Security
    env:
      SEMGREP_VERSION: '1.178.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Scan (OWASP Top 10, React, JavaScript)
        id: semgrep
        run: |
          # pipefail: sin él, el `| tee` daría el código de tee y no el de Semgrep
          set -o pipefail
          semgrep scan \
            --config p/owasp-top-ten --config p/react --config p/javascript \
            --metrics off --error \
            --sarif-output=semgrep.sarif \
            src 2>&1 | tee "$RUNNER_TEMP/semgrep.log"

      - name: Upload results to the Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py semgrep outcome="$OUTCOME" \
            log="$RUNNER_TEMP/semgrep.log" sarif=semgrep.sarif)
          python3 .github/scripts/summary_card.py \
            --title "🛡️ OWASP (Semgrep)" \
            --what "Static analysis of src with Semgrep's OWASP Top 10, React and JavaScript rules (XSS through dangerouslySetInnerHTML, eval of external data, open redirects...). Any finding blocks." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Fix the code the finding points to (the Security tab has the rule and the line). For a confirmed false positive, add a 'nosemgrep: <rule-id>' comment explaining why."

  # ========================================
  # PHASE 2: CODE QUALITY & TESTING
  # ========================================

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: |
          # Una sola pasada: el informe JSON para la tarjeta y, a partir de él, el
          # de siempre (stylish) en el log. El código de salida es el de ESLint
          set +e
          npm run lint -- --format json --output-file "$RUNNER_TEMP/eslint.json"
          ESTADO=$?
          set -e
          node -e '
            const { ESLint } = require("eslint");
            (async () => {
              const informe = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const salida = await (await new ESLint().loadFormatter("stylish")).format(informe);
              if (salida) console.log(salida);
            })().catch(() => {});
          ' "$RUNNER_TEMP/eslint.json" || true
          exit "$ESTADO"

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.eslint.outcome }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py lint outcome="$OUTCOME" report="$RUNNER_TEMP/eslint.json")
          python3 .github/scripts/summary_card.py \
            --title "🔍 Lint" \
            --what "ESLint over the whole repo (React hooks rules, unused code, undefined globals...). Zero warnings allowed (--max-warnings 0), so it also keeps the code consistent." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Run 'npm run lint' locally; many problems are fixed with 'npx eslint . --fix'."

  test:
    name: 🧪 Tests + coverage
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático y seguridad (30 sep
    # 2026). Si algo de la columna 1 FALLA, esta se salta: todo lo de la columna 1
    # es check obligatorio, así que ese fallo ya bloquea el merge, y no se gastan
    # minutos de tests en una PR que no se puede mergear. Lo que solo se salta
    # (Dependency Review en un push) no cuenta como fallo.
    needs: [lint, type-check, architecture, owasp-semgrep, dependency-audit, secret-scanning, license-check, dependency-review, commit-verification, outdated-dependencies]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Falla si falla un test o si la cobertura baja de los umbrales, que viven en
        # vite.config.js (coverage.thresholds) y los aplica Vitest (FE #553).
        id: vitest
        run: |
          # pipefail: sin él, el `| tee` daría el código de tee y no el de Vitest
          set -o pipefail
          npm test -- --run --coverage 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # Los umbrales los lee de vite.config.js, que es donde viven
      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.vitest.outcome }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py tests outcome="$OUTCOME" \
            log="$RUNNER_TEMP/vitest.log" coverage=coverage/coverage-summary.json config=vite.config.js)
          python3 .github/scripts/summary_card.py \
            --title "🧪 Tests + coverage" \
            --what "Runs the whole Vitest suite with coverage over every file in src. Fails if a test fails, if there is an unhandled error, or if any of the four coverage figures drops below its threshold in vite.config.js." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Run 'npm test -- --run --coverage' locally. For coverage, add tests for the new code; the coverage-report artifact has the per-file HTML report."

  type-check:
    name: 📝 Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check for TypeScript files
        id: check-ts
        run: |
          if find src -name "*.ts" -o -name "*.tsx" | grep -q .; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
          fi

      - name: Run type check
        if: steps.check-ts.outputs.has_typescript == 'true'
        id: tsc
        run: |
          # pipefail: sin él, el `| tee` daría el código de tee y no el de tsc
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/tsc.log"

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.tsc.outcome }}
          HAS_TS: ${{ steps.check-ts.outputs.has_typescript }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py typecheck outcome="$OUTCOME" \
            has_ts="$HAS_TS" log="$RUNNER_TEMP/tsc.log")
          python3 .github/scripts/summary_card.py \
            --title "📝 Type Check" \
            --what "Runs the TypeScript compiler without emitting (tsc --noEmit) over the project's .ts files, so a type error never reaches the build." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Run 'npx tsc --noEmit' locally and fix the reported types."

  # Contratos de arquitectura (dependency-cruiser, .dependency-cruiser.cjs): dominio
  # puro, casos de uso que solo dependen del dominio, infraestructura que no sube de
  # capa, interfaz que pasa por src/composition y sin dependencias circulares.
  architecture:
    name: 🏛️ Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10 falla npm ci con ERESOLVE en peers opcionales (ver el job de tests)
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check architecture contracts
        id: depcruise
        run: |
          # pipefail: sin él, el `| tee` daría el código de tee y no el de depcruise
          set -o pipefail
          npm run lint:architecture 2>&1 | tee "$RUNNER_TEMP/depcruise.log"

      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.depcruise.outcome }}
        run: |
          RESULT=$(python3 .github/scripts/summary_results.py architecture outcome="$OUTCOME" \
            log="$RUNNER_TEMP/depcruise.log")
          python3 .github/scripts/summary_card.py \
            --title "🏛️ Architecture" \
            --what "dependency-cruiser checks the Clean Architecture contracts in .dependency-cruiser.cjs: a pure domain, use cases that only depend on the domain, infrastructure that never imports upwards, UI wired through src/composition, and no circular imports." \
            --status "$STATUS" --result "$RESULT" \
            --if-fails "Move the import so it respects the layer (usually: depend on a domain interface and wire the implementation in src/composition). 'npm run lint:architecture' reproduces it."

  # ========================================
  # PHASE 3: BUILD
  # ========================================

  build:
    name: ${{ matrix.nombre }}
    strategy:
      # Las dos a la vez y hasta el final: un fallo de una no esconde la otra
      fail-fast: false
      matrix:
        include:
          - build: ci
            nombre: 🏗️ Build
          - build: render
            nombre: 🚀 Deploy like Render
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático y seguridad (30 sep
    # 2026). Si algo de la columna 1 FALLA, esta se salta: todo lo de la columna 1
    # es check obligatorio, así que ese fallo ya bloquea el merge, y no se gastan
    # minutos de tests en una PR que no se puede mergear. Lo que solo se salta
    # (Dependency Review en un push) no cuenta como fallo.
    needs: [lint, type-check, architecture, owasp-semgrep, dependency-audit, secret-scanning, license-check, dependency-review, commit-verification, outdated-dependencies]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ===== Entrada «Deploy like Render» de la matriz =====
      # En su propia máquina: Render usa el npm que trae su Node, y en la otra
      # entrada se sube a la 11.17.
      # Render no usa el entorno de arriba: el Node de .nvmrc con su npm de serie,
      # sin subirlo, y `npm install; npm run build` con sus variables. La v2.23.0
      # del backend cayó en Render con todo el CI en verde por una diferencia
      # así; aquí se repite su build y se sirve el resultado como sitio estático.
      # Lo que NO se reproduce: la reescritura de rutas (/* → /index.html) y las
      # cabeceras, que viven en el panel de Render y no en el repo.
      # .nvmrc dice «22»: Render iba con su 22.16.0 por defecto, por debajo de lo
      # que pide react-router (>=22.22), y ahora usa la 22 actual, como el CI.
      - name: Setup Node like Render
        if: matrix.build == 'render'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Build like Render
        if: matrix.build == 'render'
        id: render
        env:
          # Los nombres que tiene el Static Site en Render; valores de prueba
          VITE_API_BASE_URL: https://api.rydercupfriends.com
          VITE_API_TIMEOUT: '30000'
          VITE_APP_NAME: RyderCupFriends
          VITE_APP_VERSION: ci
          VITE_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
          VITE_GOOGLE_REDIRECT_URI: https://www.rydercupfriends.com/auth/google/callback
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_DEBUG: 'false'
          VITE_SENTRY_ATTACH_STACKTRACE: 'true'
          VITE_SENTRY_AUTO_SESSION_TRACKING: 'true'
          VITE_SENTRY_ENABLE_FEEDBACK: 'false'
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.1'
          VITE_SENTRY_PROFILES_SAMPLE_RATE: '0.1'
          VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: '0.1'
          VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: '1.0'
        run: |
          echo "Node $(node --version) · npm $(npm --version)"
          { echo "node=$(node --version)"; echo "npm=$(npm --version)"; } >> "$GITHUB_OUTPUT"  # para la tarjeta
          cp package-lock.json "$RUNNER_TEMP/lock-del-repo.json"
          rm -rf node_modules dist
          npm install
          # El npm de Render reescribe el lockfile (metadatos) sin cambiar
          # versiones; lo que no puede pasar es que instale OTRAS versiones que
          # las que han pasado los tests
          python3 .github/scripts/lock_versions_match.py "$RUNNER_TEMP/lock-del-repo.json" package-lock.json
          npm run build

      - name: Serve the Render build like a static site
        if: matrix.build == 'render'
        id: smoke
        run: python3 .github/scripts/smoke_static_site.py dist "$(node -p "require('./package.json').version")"

      # ===== Entrada «Build» de la matriz: el del CI (presupuesto y artefacto) =====
      - name: Setup Node.js
        if: matrix.build == 'ci'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        if: matrix.build == 'ci'
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        if: matrix.build == 'ci'
        run: npm ci

      - name: Build application
        if: matrix.build == 'ci'
        id: vite
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        if: matrix.build == 'ci'
        # Antes en code-quality, que compilaba otra vez solo para esto (28 sep 2026)
        id: bundle
        run: |
          echo "📦 Bundle size analysis:"

          # Get total bundle size
          TOTAL_SIZE=$(du -sb dist/assets/*.js 2>/dev/null | awk '{s+=$1} END {print s}')

          # Sin JS que medir no hay nada que dar por bueno: la salida de Vite ha
          # cambiado de sitio o el build no la ha escrito (antes salía en verde)
          if [ -z "$TOTAL_SIZE" ]; then
            echo "::error::No JS bundles found in dist/assets: nothing was measured"
            exit 1
          fi

          # Convert to KB
          TOTAL_SIZE_KB=$((TOTAL_SIZE / 1024))

          echo "  Total JS bundle size: ${TOTAL_SIZE_KB} KB"
          echo "size_kb=$TOTAL_SIZE_KB" >> $GITHUB_OUTPUT

          # Define budget (in KB)
          # v2.1: Reduced from 1600 KB to 1400 KB after replacing country-flag-icons (239 KB) with CDN images
          # v2.0.11: Raised to 1500 KB after Sprint 3 invitations system (2 new pages, 3 components, i18n namespace)
          # Jul 2026: Raised to 1600 KB after minor-updates dependency bump (Sentry SDK growth mainly); no
          # trimmable dead code found (knip-flagged unused deps/files aren't part of the compiled bundle anyway)
          # 29 Jul 2026: Raised to 1650 KB after Quick Match pre-start summary + HandicapInputPanel (new
          # component, no new dependencies) pushed actual size to 1602 KB; small headroom added instead of
          # re-bumping on the next minor feature
          # 2 Aug 2026: Raised to 1700 KB after the admin panel Competitions tab (new table/modal components +
          # i18n) pushed actual size to 1662 KB; no trimmable code found — the check sums every dist/assets/*.js
          # file, so code-splitting the new tab wouldn't reduce the total, only move bytes to another chunk
          # 10 Aug 2026: Raised to 1750 KB after the player statistics work (FE #306): stats data layer,
          # NextMatchBanner, RecentMatches and the /stats page pushed the total to 1705 KB. The page is
          # lazy-loaded, but this check sums every dist/assets/*.js file, so splitting moves bytes
          # between chunks without lowering the total
          # 14 Aug 2026: Raised to 1800 KB. develop stood at 1744 KB and TeeSelectPanel (FE #377) adds
          # 2.6 KB, which left only 3.2 KB under the previous 1750 KB budget — thin enough that the next
          # feature of any size would turn the check red mid-review. Against this 1800 KB budget the same
          # 1746.8 KB leaves 53.2 KB. Sentry is 328 KB of the total (19%) and is the one real lever here;
          # trimming it is tracked separately. Raised in one step rather than per-feature so the budget
          # stops being a thing we bump under pressure
          # 30 Aug 2026: Raised to 2000 KB. Same story again, which is the point: develop stood at
          # 1796 KB — 4 KB under the 1800 budget — so offline scoring (FE #515) turned the check red
          # by 3 KB and so would anything else. The warning is raised to 1900 KB too: at 1500 it
          # fired on every build and had stopped meaning "you are near the ceiling". Sentry is still
          # the one real lever (328 KB, 19%) and trimming it is still tracked separately; until that
          # happens each raise buys about six months, not a fix
          # 24 Sep 2026: Raised to 2200 KB, warning at 2100 KB (decided by the product owner).
          # The competition redesign's last pieces landed together: the agenda in the
          # competition detail (FE #654, #709) and the reason a session has no matches
          # plus the organiser's dashboard warning (BE #361, #708). Together they left
          # develop at 1999.4 KB, half a KB under the 2000 budget, so the next change of
          # any size would have turned the check red. Removing RoundFormModal already
          # took back what it could. Sentry (328 KB) is still the one real lever, and
          # trimming it is still tracked separately.
          MAX_BUNDLE_SIZE_KB=2200
          WARNING_THRESHOLD_KB=2100
          { echo "budget_kb=$MAX_BUNDLE_SIZE_KB"; echo "warning_kb=$WARNING_THRESHOLD_KB"; } >> "$GITHUB_OUTPUT"

          # List all bundles with sizes
          echo ""
          echo "  Individual bundles:"
          du -h dist/assets/*.js | sort -h

          # Check against budget
          if [ $TOTAL_SIZE_KB -gt $MAX_BUNDLE_SIZE_KB ]; then
            echo ""
            echo "❌ Bundle size (${TOTAL_SIZE_KB} KB) exceeds budget (${MAX_BUNDLE_SIZE_KB} KB)!"
            echo "💡 Tip: Consider code splitting, tree shaking, or removing unused dependencies"
            exit 1
          elif [ $TOTAL_SIZE_KB -gt $WARNING_THRESHOLD_KB ]; then
            echo ""
            echo "⚠️ Bundle size (${TOTAL_SIZE_KB} KB) is approaching budget limit (${MAX_BUNDLE_SIZE_KB} KB)"
            echo "   Current usage: $(( TOTAL_SIZE_KB * 100 / MAX_BUNDLE_SIZE_KB ))%"
          else
            echo ""
            echo "✅ Bundle size is within budget"
            echo "   Budget used: $(( TOTAL_SIZE_KB * 100 / MAX_BUNDLE_SIZE_KB ))% (${TOTAL_SIZE_KB}/${MAX_BUNDLE_SIZE_KB} KB)"
          fi
      - name: Check build output
        if: matrix.build == 'ci'
        id: dist
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah dist/

      - name: Upload build artifacts
        if: matrix.build == 'ci'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
          retention-days: 7

      # Una tarjeta por entrada de la matriz, con su nombre
      - name: Summary card
        if: always()
        continue-on-error: true  # la tarjeta nunca tumba el job
        env:
          STATUS: ${{ job.status }}
          ENTRY: ${{ matrix.build }}
          TITLE: ${{ matrix.nombre }}
          # Entrada «Build»
          VITE_OUTCOME: ${{ steps.vite.outcome }}
          SIZE_KB: ${{ steps.bundle.outputs.size_kb }}
          BUDGET_KB: ${{ steps.bundle.outputs.budget_kb }}
          WARNING_KB: ${{ steps.bundle.outputs.warning_kb }}
          DIST_OUTCOME: ${{ steps.dist.outcome }}
          # Entrada «Deploy like Render»
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          NODE_VERSION: ${{ steps.render.outputs.node }}
          NPM_VERSION: ${{ steps.render.outputs.npm }}
          LOCK_PACKAGES: ${{ steps.render.outputs.lock_packages }}
          LOCK_DIFFERENCES: ${{ steps.render.outputs.lock_differences }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_RESOURCES: ${{ steps.smoke.outputs.smoke_resources }}
          SMOKE_INTEGRITY: ${{ steps.smoke.outputs.smoke_integrity }}
          SMOKE_CHUNKS: ${{ steps.smoke.outputs.smoke_chunks }}
          SMOKE_FAILURES: ${{ steps.smoke.outputs.smoke_failures }}
          SMOKE_VERSION: ${{ steps.smoke.outputs.smoke_version }}
        run: |
          if [ "$ENTRY" = render ]; then
            RESULT=$(python3 .github/scripts/summary_results.py build-render build_outcome="$RENDER_OUTCOME" \
              node="$NODE_VERSION" npm="$NPM_VERSION" \
              lock_packages="$LOCK_PACKAGES" lock_differences="$LOCK_DIFFERENCES" \
              smoke_outcome="$SMOKE_OUTCOME" smoke_resources="$SMOKE_RESOURCES" \
              smoke_integrity="$SMOKE_INTEGRITY" smoke_chunks="$SMOKE_CHUNKS" \
              smoke_failures="$SMOKE_FAILURES" smoke_version="$SMOKE_VERSION")
            WHAT="Repeats Render's build on a clean machine: the Node from .nvmrc with its bundled npm, 'npm install' and 'npm run build' with Render's variable names. Then checks that npm installed the lockfile's exact versions and serves dist/ as a static site to prove the app loads."
            IF_FAILS="Render would ship a broken site or a different build from the one tested. A version difference: update package-lock.json with that npm. A smoke failure: a missing chunk, an integrity hash or version.json in dist/."
          else
            RESULT=$(python3 .github/scripts/summary_results.py build-ci build_outcome="$VITE_OUTCOME" \
              size_kb="$SIZE_KB" budget_kb="$BUDGET_KB" warning_kb="$WARNING_KB" output_outcome="$DIST_OUTCOME")
            WHAT="Builds the production bundle with Vite and checks the total size of dist/assets/*.js against the budget in this workflow. The build is kept as the build-output artifact."
            IF_FAILS="If the build broke, run 'npm run build' locally. If the budget was exceeded, trim the code or raise MAX_BUNDLE_SIZE_KB with its reason, as the history in ci-cd.yml does."
          fi
          python3 .github/scripts/summary_card.py \
            --title "$TITLE" --what "$WHAT" \
            --status "$STATUS" --result "$RESULT" --if-fails "$IF_FAILS"

  # ========================================
  # PHASE 4: PIPELINE SUMMARY
  # ========================================

  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # commit-verification solo pinta su fila: no entra en la decisión de abajo
    needs: [commit-verification, dependency-audit, secret-scanning, license-check, dependency-review, owasp-semgrep, outdated-dependencies, lint, test, type-check, architecture, build]
    if: always()
    steps:
      # El índice: el veredicto y una fila por job. El detalle de cada uno está
      # en su tarjeta (el paso «Summary card» al final de cada job)
      - name: Generate Pipeline Summary
        env:
          COMMITS: ${{ needs.commit-verification.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
          SECRETS: ${{ needs.secret-scanning.result }}
          LICENSES: ${{ needs.license-check.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          OUTDATED: ${{ needs.outdated-dependencies.result }}
          SEMGREP: ${{ needs.owasp-semgrep.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.type-check.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          # Falla con los mismos ocho de siempre, y solo con success pasan (un
          # skipped tampoco). Los otros no lo tumban aquí, pero si fallan, tests y
          # build se saltan, y eso sí. Entre comillas: uno vacío no se pierde
          FALLA=0
          for r in "$AUDIT" "$SECRETS" "$LICENSES" "$LINT" "$TEST" "$SEMGREP" "$ARCHITECTURE" "$BUILD"; do
            [ "$r" = success ] || FALLA=1
          done

          estado() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❔ ${1:-Unknown}" ;;
            esac
          }

          FILAS=(
            "$COMMITS|🔏 Signed commits|Every commit is signed and verified by GitHub"
            "$AUDIT|🔒 npm audit|No critical or high vulnerability in the installed packages"
            "$SECRETS|🔐 Secret Scanning|TruffleHog finds no live credential in the new commits"
            "$LICENSES|📜 License Compliance|No GPL-3.0, AGPL-3.0 or LGPL-3.0 dependency"
            "$REVIEW|🔎 Dependency Review|The PR adds no dependency with a known vulnerability (PRs only)"
            "$OUTDATED|📦 Outdated deps|Lists packages with newer releases (informational)"
            "$SEMGREP|🛡️ OWASP (Semgrep)|OWASP Top 10, React and JavaScript rules over src"
            "$LINT|🔍 Lint|ESLint with zero warnings allowed"
            "$TYPES|📝 Type Check|tsc --noEmit over the TypeScript files"
            "$ARCHITECTURE|🏛️ Architecture|Layer contracts and no circular imports (dependency-cruiser)"
            "$TEST|🧪 Tests + coverage|Vitest suite and the four coverage thresholds"
            "$BUILD|🏗️ Build · 🚀 Deploy like Render|Production build within budget, and Render's own build served as a static site"
          )

          NO_PASAN=0
          for fila in "${FILAS[@]}"; do
            case "${fila%%|*}" in failure|cancelled) NO_PASAN=$((NO_PASAN + 1)) ;; esac
          done

          {
            if [ "$FALLA" -eq 0 ]; then
              echo "## ✅ Pipeline passed"
            elif [ "$NO_PASAN" -eq 1 ]; then
              echo "## ❌ Pipeline failed — 1 check did not pass"
            elif [ "$NO_PASAN" -gt 1 ]; then
              echo "## ❌ Pipeline failed — $NO_PASAN checks did not pass"
            else
              echo "## ❌ Pipeline failed — required checks did not run"
            fi
            echo ""
            echo "| Check | What it does | Status |"
            echo "|-------|--------------|--------|"
            for fila in "${FILAS[@]}"; do
              IFS='|' read -r resultado nombre que <<< "$fila"
              echo "| $nombre | $que | $(estado "$resultado") |"
            done
            echo ""
            echo "Details for each check are in its card."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$FALLA"
