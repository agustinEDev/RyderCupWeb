name: CI/CD & Security Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]
  schedule:
    # Run security checks every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ========================================
  # PHASE 1: SECURITY CHECKS (CRITICAL)
  # ========================================

  commit-verification:
    name: 🔏 Signed commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # la lista de commits de la PR
    steps:
      - name: Checkout the script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Todos los commits de la PR (o del push), verificados por GitHub. Antes se
      # miraba HEAD, que en una PR es el merge que firma GitHub: un commit sin
      # firmar en la rama pasaba (la PR #80 tiene uno), y sin el secreto de las
      # claves salía en verde sin mirar nada (ver el script)
      - name: Verify every commit is signed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) bash .github/scripts/verify-signed-commits.sh pr "$PR_NUMBER" ;;
            push) bash .github/scripts/verify-signed-commits.sh range "$BEFORE" "$AFTER" ;;
            schedule) echo "El escaneo semanal no trae commits nuevos: nada que verificar" ;;
            # Un disparador nuevo (merge_group, workflow_dispatch...) no pasa sin mirar
            *) echo "::error::Evento '$EVENT' sin verificación de firmas definida"; exit 2 ;;
          esac

  dependency-audit:
    name: 🔒 npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      moderate: ${{ steps.audit.outputs.moderate }}
      total: ${{ steps.audit.outputs.total }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Verify package-lock.json integrity
        run: |
          echo "🔒 Verifying package-lock.json was not modified..."

          git diff --exit-code package-lock.json || {
            echo "❌ package-lock.json was modified during npm ci!"
            echo "Run 'npm install' locally and commit the updated package-lock.json."
            exit 1
          }

          echo "✅ package-lock.json integrity verified"

      - name: Run npm audit
        id: audit
        run: |
          # npm audit sale con 1 si encuentra algo: decide la puerta, que también
          # falla si el informe no trae el recuento (un registro caído no es un
          # aprobado). Ver .github/scripts/npm-audit-gate.sh
          npm audit --json > audit-report.json || true
          set +e
          bash .github/scripts/npm-audit-gate.sh audit-report.json
          PUERTA=$?
          set -e
          if [ "$PUERTA" -ne 0 ]; then
            # 1: altas o críticas · 2: no se pudo auditar (registro caído)
            [ "$PUERTA" -eq 1 ] && { npm audit --audit-level=moderate || true; }  # el detalle
            exit "$PUERTA"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  secret-scanning:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (Filesystem Scan)
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          extra_args: --debug --only-verified

  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          echo "📜 Checking dependency licenses..."
          npx license-checker --json --out licenses.json

          # Check for problematic licenses
          FORBIDDEN_LICENSES="GPL-3.0 AGPL-3.0 LGPL-3.0"

          for license in $FORBIDDEN_LICENSES; do
            if npx license-checker --summary | grep -q "$license"; then
              echo "❌ Forbidden license found: $license"
              npx license-checker --summary
              exit 1
            fi
          done

          echo "✅ All licenses are compliant"
          npx license-checker --summary

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  # Sustituye a Snyk (cuota agotada desde hace meses): bloquea la PR que AÑADE
  # o sube una dependencia con una vulnerabilidad conocida de gravedad moderada
  # o más. Lo que ya está en develop lo vigilan las alertas de Dependabot y npm audit.
  dependency-review:
    name: 🔎 Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  outdated-dependencies:
    name: 📦 Outdated deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated packages
        id: outdated
        run: |
          echo "📦 Checking for outdated dependencies..."
          npm outdated --json > outdated.json || true

          # Count outdated packages
          OUTDATED_COUNT=$(cat outdated.json | jq 'length')

          echo "📊 Found $OUTDATED_COUNT outdated packages"
          echo "count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT

          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "⚠️ Outdated packages found (informational only, does not fail CI):"
            npm outdated || true
          else
            echo "✅ All packages are up to date"
          fi

      - name: Upload outdated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outdated-dependencies
          path: outdated.json
          retention-days: 30

  # OWASP Top 10 con Semgrep (p/owasp-top-ten, p/react, p/javascript): eval con
  # datos externos, redirecciones abiertas, dangerouslySetInnerHTML... Bloquea con
  # cualquier aviso (el 28 sep 2026 el código estaba limpio) y sube el SARIF a la
  # pestaña Security. Complementa a CodeQL.
  owasp-semgrep:
    name: 🛡️ OWASP (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Subida del SARIF a la pestaña Security
    env:
      SEMGREP_VERSION: '1.178.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Scan (OWASP Top 10, React, JavaScript)
        run: |
          semgrep scan \
            --config p/owasp-top-ten --config p/react --config p/javascript \
            --metrics off --error \
            --sarif-output=semgrep.sarif \
            src

      - name: Upload results to the Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ========================================
  # PHASE 2: CODE QUALITY & TESTING
  # ========================================

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: 🧪 Tests + coverage
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático y seguridad (30 sep
    # 2026). Si algo de la columna 1 FALLA, esta se salta: todo lo de la columna 1
    # es check obligatorio, así que ese fallo ya bloquea el merge, y no se gastan
    # minutos de tests en una PR que no se puede mergear. Lo que solo se salta
    # (Dependency Review en un push) no cuenta como fallo.
    needs: [lint, type-check, architecture, owasp-semgrep, dependency-audit, secret-scanning, license-check, dependency-review, commit-verification, outdated-dependencies]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Falla si falla un test o si la cobertura baja de los umbrales, que viven en
        # vite.config.js (coverage.thresholds) y los aplica Vitest (FE #553).
        run: npm test -- --run --coverage

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  type-check:
    name: 📝 Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check for TypeScript files
        id: check-ts
        run: |
          if find src -name "*.ts" -o -name "*.tsx" | grep -q .; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
          fi

      - name: Run type check
        if: steps.check-ts.outputs.has_typescript == 'true'
        run: npx tsc --noEmit

  # Contratos de arquitectura (dependency-cruiser, .dependency-cruiser.cjs): dominio
  # puro, casos de uso que solo dependen del dominio, infraestructura que no sube de
  # capa, interfaz que pasa por src/composition y sin dependencias circulares.
  architecture:
    name: 🏛️ Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        # npm 10 falla npm ci con ERESOLVE en peers opcionales (ver el job de tests)
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check architecture contracts
        run: npm run lint:architecture

  # ========================================
  # PHASE 3: BUILD
  # ========================================

  build:
    name: ${{ matrix.nombre }}
    strategy:
      # Las dos a la vez y hasta el final: un fallo de una no esconde la otra
      fail-fast: false
      matrix:
        include:
          - build: ci
            nombre: 🏗️ Build
          - build: render
            nombre: 🏗️ Build like Render
    runs-on: ubuntu-24.04
    # Columna 2 del gráfico: espera a la de análisis estático y seguridad (30 sep
    # 2026). Si algo de la columna 1 FALLA, esta se salta: todo lo de la columna 1
    # es check obligatorio, así que ese fallo ya bloquea el merge, y no se gastan
    # minutos de tests en una PR que no se puede mergear. Lo que solo se salta
    # (Dependency Review en un push) no cuenta como fallo.
    needs: [lint, type-check, architecture, owasp-semgrep, dependency-audit, secret-scanning, license-check, dependency-review, commit-verification, outdated-dependencies]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ===== Entrada «Build like Render» de la matriz =====
      # En su propia máquina: Render usa el npm que trae su Node, y en la otra
      # entrada se sube a la 11.17.
      # Render no usa el entorno de arriba: el Node de .nvmrc con su npm de serie,
      # sin subirlo, y `npm install; npm run build` con sus variables. La v2.23.0
      # del backend cayó en Render con todo el CI en verde por una diferencia
      # así; aquí se repite su build y se sirve el resultado como sitio estático.
      # Lo que NO se reproduce: la reescritura de rutas (/* → /index.html) y las
      # cabeceras, que viven en el panel de Render y no en el repo.
      # .nvmrc dice «22»: Render iba con su 22.16.0 por defecto, por debajo de lo
      # que pide react-router (>=22.22), y ahora usa la 22 actual, como el CI.
      - name: Setup Node like Render
        if: matrix.build == 'render'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Build like Render
        if: matrix.build == 'render'
        env:
          # Los nombres que tiene el Static Site en Render; valores de prueba
          VITE_API_BASE_URL: https://api.rydercupfriends.com
          VITE_API_TIMEOUT: '30000'
          VITE_APP_NAME: RyderCupFriends
          VITE_APP_VERSION: ci
          VITE_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
          VITE_GOOGLE_REDIRECT_URI: https://www.rydercupfriends.com/auth/google/callback
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_DEBUG: 'false'
          VITE_SENTRY_ATTACH_STACKTRACE: 'true'
          VITE_SENTRY_AUTO_SESSION_TRACKING: 'true'
          VITE_SENTRY_ENABLE_FEEDBACK: 'false'
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.1'
          VITE_SENTRY_PROFILES_SAMPLE_RATE: '0.1'
          VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: '0.1'
          VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: '1.0'
        run: |
          echo "Node $(node --version) · npm $(npm --version)"
          cp package-lock.json "$RUNNER_TEMP/lock-del-repo.json"
          rm -rf node_modules dist
          npm install
          # El npm de Render reescribe el lockfile (metadatos) sin cambiar
          # versiones; lo que no puede pasar es que instale OTRAS versiones que
          # las que han pasado los tests
          python3 .github/scripts/lock_versions_match.py "$RUNNER_TEMP/lock-del-repo.json" package-lock.json
          npm run build

      - name: Serve the Render build like a static site
        if: matrix.build == 'render'
        run: python3 .github/scripts/smoke_static_site.py dist "$(node -p "require('./package.json').version")"

      # ===== Entrada «Build» de la matriz: el del CI (presupuesto y artefacto) =====
      - name: Setup Node.js
        if: matrix.build == 'ci'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm
        if: matrix.build == 'ci'
        # npm 10.8.2 (bundled with Node 20) fails npm ci with ERESOLVE on
        # optional peer dependency mismatches (e.g. typescript vs i18next's
        # "^5 || ^6" peerOptional range) that npm 11 treats as non-fatal.
        # Pinned explicitly so CI stays reproducible across Node bumps.
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        if: matrix.build == 'ci'
        run: npm ci

      - name: Build application
        if: matrix.build == 'ci'
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        if: matrix.build == 'ci'
        # Antes en code-quality, que compilaba otra vez solo para esto (28 sep 2026)
        id: bundle
        run: |
          echo "📦 Bundle size analysis:"

          # Get total bundle size
          TOTAL_SIZE=$(du -sb dist/assets/*.js 2>/dev/null | awk '{s+=$1} END {print s}')

          # Sin JS que medir no hay nada que dar por bueno: la salida de Vite ha
          # cambiado de sitio o el build no la ha escrito (antes salía en verde)
          if [ -z "$TOTAL_SIZE" ]; then
            echo "::error::No JS bundles found in dist/assets: nothing was measured"
            exit 1
          fi

          # Convert to KB
          TOTAL_SIZE_KB=$((TOTAL_SIZE / 1024))

          echo "  Total JS bundle size: ${TOTAL_SIZE_KB} KB"
          echo "size_kb=$TOTAL_SIZE_KB" >> $GITHUB_OUTPUT

          # Define budget (in KB)
          # v2.1: Reduced from 1600 KB to 1400 KB after replacing country-flag-icons (239 KB) with CDN images
          # v2.0.11: Raised to 1500 KB after Sprint 3 invitations system (2 new pages, 3 components, i18n namespace)
          # Jul 2026: Raised to 1600 KB after minor-updates dependency bump (Sentry SDK growth mainly); no
          # trimmable dead code found (knip-flagged unused deps/files aren't part of the compiled bundle anyway)
          # 29 Jul 2026: Raised to 1650 KB after Quick Match pre-start summary + HandicapInputPanel (new
          # component, no new dependencies) pushed actual size to 1602 KB; small headroom added instead of
          # re-bumping on the next minor feature
          # 2 Aug 2026: Raised to 1700 KB after the admin panel Competitions tab (new table/modal components +
          # i18n) pushed actual size to 1662 KB; no trimmable code found — the check sums every dist/assets/*.js
          # file, so code-splitting the new tab wouldn't reduce the total, only move bytes to another chunk
          # 10 Aug 2026: Raised to 1750 KB after the player statistics work (FE #306): stats data layer,
          # NextMatchBanner, RecentMatches and the /stats page pushed the total to 1705 KB. The page is
          # lazy-loaded, but this check sums every dist/assets/*.js file, so splitting moves bytes
          # between chunks without lowering the total
          # 14 Aug 2026: Raised to 1800 KB. develop stood at 1744 KB and TeeSelectPanel (FE #377) adds
          # 2.6 KB, which left only 3.2 KB under the previous 1750 KB budget — thin enough that the next
          # feature of any size would turn the check red mid-review. Against this 1800 KB budget the same
          # 1746.8 KB leaves 53.2 KB. Sentry is 328 KB of the total (19%) and is the one real lever here;
          # trimming it is tracked separately. Raised in one step rather than per-feature so the budget
          # stops being a thing we bump under pressure
          # 30 Aug 2026: Raised to 2000 KB. Same story again, which is the point: develop stood at
          # 1796 KB — 4 KB under the 1800 budget — so offline scoring (FE #515) turned the check red
          # by 3 KB and so would anything else. The warning is raised to 1900 KB too: at 1500 it
          # fired on every build and had stopped meaning "you are near the ceiling". Sentry is still
          # the one real lever (328 KB, 19%) and trimming it is still tracked separately; until that
          # happens each raise buys about six months, not a fix
          # 24 Sep 2026: Raised to 2200 KB, warning at 2100 KB (decided by the product owner).
          # The competition redesign's last pieces landed together: the agenda in the
          # competition detail (FE #654, #709) and the reason a session has no matches
          # plus the organiser's dashboard warning (BE #361, #708). Together they left
          # develop at 1999.4 KB, half a KB under the 2000 budget, so the next change of
          # any size would have turned the check red. Removing RoundFormModal already
          # took back what it could. Sentry (328 KB) is still the one real lever, and
          # trimming it is still tracked separately.
          MAX_BUNDLE_SIZE_KB=2200
          WARNING_THRESHOLD_KB=2100

          # List all bundles with sizes
          echo ""
          echo "  Individual bundles:"
          du -h dist/assets/*.js | sort -h

          # Check against budget
          if [ $TOTAL_SIZE_KB -gt $MAX_BUNDLE_SIZE_KB ]; then
            echo ""
            echo "❌ Bundle size (${TOTAL_SIZE_KB} KB) exceeds budget (${MAX_BUNDLE_SIZE_KB} KB)!"
            echo "💡 Tip: Consider code splitting, tree shaking, or removing unused dependencies"
            exit 1
          elif [ $TOTAL_SIZE_KB -gt $WARNING_THRESHOLD_KB ]; then
            echo ""
            echo "⚠️ Bundle size (${TOTAL_SIZE_KB} KB) is approaching budget limit (${MAX_BUNDLE_SIZE_KB} KB)"
            echo "   Current usage: $(( TOTAL_SIZE_KB * 100 / MAX_BUNDLE_SIZE_KB ))%"
          else
            echo ""
            echo "✅ Bundle size is within budget"
            echo "   Budget used: $(( TOTAL_SIZE_KB * 100 / MAX_BUNDLE_SIZE_KB ))% (${TOTAL_SIZE_KB}/${MAX_BUNDLE_SIZE_KB} KB)"
          fi
      - name: Check build output
        if: matrix.build == 'ci'
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah dist/

      - name: Upload build artifacts
        if: matrix.build == 'ci'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # ========================================
  # PHASE 4: PIPELINE SUMMARY
  # ========================================

  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [dependency-audit, secret-scanning, license-check, dependency-review, owasp-semgrep, outdated-dependencies, lint, test, type-check, architecture, build]
    if: always()
    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "# 🏆 CI/CD & Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Security Phase
          echo "## 🔒 Phase 1: Security Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          # Dependency Audit
          MODERATE_COUNT="${{ needs.dependency-audit.outputs.moderate }}"
          TOTAL_COUNT="${{ needs.dependency-audit.outputs.total }}"
          MODERATE_COUNT="${MODERATE_COUNT:-0}"
          TOTAL_COUNT="${TOTAL_COUNT:-0}"
          if [ "${{ needs.dependency-audit.result }}" == "success" ]; then
            if [ "$MODERATE_COUNT" -gt 0 ]; then
              echo "| 🔒 Dependency Audit | ⚠️ Passed | $MODERATE_COUNT moderate vulnerabilities ($TOTAL_COUNT total) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| 🔒 Dependency Audit | ✅ Passed | No critical/high vulnerabilities |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| 🔒 Dependency Audit | ❌ Failed | Critical/high vulnerabilities found |" >> $GITHUB_STEP_SUMMARY
          fi

          # Secret Scanning
          if [ "${{ needs.secret-scanning.result }}" == "success" ]; then
            echo "| 🔐 Secret Scanning | ✅ Passed | No secrets detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔐 Secret Scanning | ❌ Failed | Secrets found in code |" >> $GITHUB_STEP_SUMMARY
          fi

          # License Check
          if [ "${{ needs.license-check.result }}" == "success" ]; then
            echo "| 📜 License Compliance | ✅ Passed | All licenses compliant |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📜 License Compliance | ❌ Failed | Forbidden licenses detected |" >> $GITHUB_STEP_SUMMARY
          fi

          # Dependency Review (solo corre en PRs)
          if [ "${{ needs.dependency-review.result }}" == "success" ]; then
            echo "| 🔎 Dependency Review | ✅ Passed | No vulnerable dependency added |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.dependency-review.result }}" == "skipped" ]; then
            echo "| 🔎 Dependency Review | ⏭️ Skipped | Only runs on pull requests |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔎 Dependency Review | ❌ Failed | A vulnerable dependency is being added |" >> $GITHUB_STEP_SUMMARY
          fi

          # OWASP Top 10 (Semgrep)
          if [ "${{ needs.owasp-semgrep.result }}" == "success" ]; then
            echo "| 🛡️ OWASP Top 10 (Semgrep) | ✅ Passed | No findings (owasp-top-ten, react, javascript) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🛡️ OWASP Top 10 (Semgrep) | ❌ Failed | See the Security tab |" >> $GITHUB_STEP_SUMMARY
          fi

          # Outdated Dependencies
          if [ "${{ needs.outdated-dependencies.result }}" == "success" ]; then
            echo "| 📦 Outdated Deps | ℹ️ Info | Check artifacts for details |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Quality Phase
          echo "## 🎯 Phase 2: Code Quality & Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          # Architecture
          if [ "${{ needs.architecture.result }}" == "success" ]; then
            echo "| 🏛️ Architecture Contracts | ✅ Passed | Layers, composition root, no cycles |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏛️ Architecture Contracts | ❌ Failed | A dependency breaks a layer rule |" >> $GITHUB_STEP_SUMMARY
          fi

          # Lint
          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "| 🔍 Lint & Format | ✅ Passed | Code style is consistent |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.lint.result }}" == "skipped" ]; then
            echo "| 🔍 Lint & Format | ⏭️ Skipped | Security checks failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔍 Lint & Format | ❌ Failed | Linting errors found |" >> $GITHUB_STEP_SUMMARY
          fi

          # Test
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "| 🧪 Tests & Coverage | ✅ Passed | All tests passed, coverage OK |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.result }}" == "skipped" ]; then
            echo "| 🧪 Tests & Coverage | ⏭️ Skipped | Security checks failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Tests & Coverage | ❌ Failed | Tests failed or coverage low |" >> $GITHUB_STEP_SUMMARY
          fi

          # Type Check
          if [ "${{ needs.type-check.result }}" == "success" ]; then
            echo "| 📝 Type Check | ✅ Passed | TypeScript types are valid |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.type-check.result }}" == "skipped" ]; then
            echo "| 📝 Type Check | ⏭️ Skipped | No TypeScript or security failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📝 Type Check | ❌ Failed | Type errors found |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Build Phase
          echo "## 🏗️ Phase 3: Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          # Build
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "| 🏗️ Build Application | ✅ Passed | Production build successful |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "| 🏗️ Build Application | ⏭️ Skipped | Previous checks failed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Build Application | ❌ Failed | Build errors detected |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Final Status
          echo "## 🎯 Final Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if all critical jobs passed
          if [ "${{ needs.dependency-audit.result }}" == "success" ] && \
             [ "${{ needs.secret-scanning.result }}" == "success" ] && \
             [ "${{ needs.license-check.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.owasp-semgrep.result }}" == "success" ] && \
             [ "${{ needs.architecture.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "### ✅ Pipeline Passed Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All critical checks have passed. Your code is ready for deployment! 🚀" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Pipeline Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more critical checks failed. Please review the errors above and fix them before proceeding." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Failed Jobs:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            [ "${{ needs.dependency-audit.result }}" != "success" ] && echo "- 🔒 Dependency Audit" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.secret-scanning.result }}" != "success" ] && echo "- 🔐 Secret Scanning" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.license-check.result }}" != "success" ] && echo "- 📜 License Compliance" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ] && echo "- 🔍 Lint & Format" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ] && echo "- 🧪 Tests & Coverage" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.type-check.result }}" != "success" ] && [ "${{ needs.type-check.result }}" != "skipped" ] && echo "- 📝 Type Check" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.owasp-semgrep.result }}" != "success" ] && echo "- 🛡️ OWASP Top 10 (Semgrep)" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.architecture.result }}" != "success" ] && echo "- 🏛️ Architecture Contracts" >> $GITHUB_STEP_SUMMARY
            [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ] && echo "- 🏗️ Build or Build like Render (see which in the checks)" >> $GITHUB_STEP_SUMMARY

            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
