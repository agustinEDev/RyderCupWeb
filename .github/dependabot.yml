version: 2
updates:
  # Mantener npm dependencies actualizadas
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"  # Seguir Gitflow: dependabot → develop → release → main
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Espera 5 días antes de proponer una versión recién publicada: es la ventana de
    # los paquetes envenenados de npm, que se retiran en horas o días (re-auditoría del
    # 16 nov 2026, INF-12). Las actualizaciones de seguridad no esperan.
    cooldown:
      default-days: 5
    reviewers:
      - "agustinEDev"
    labels:
      - "dependencies"
      - "automated"
    
    # Agrupar actualizaciones menores y patches
    groups:
      # Grupo para React y ecosistema
      react:
        patterns:
          - "react*"
          - "@types/react*"
      
      # Grupo para Vite y plugins
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      
      # Grupo para testing
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"  # vitest y @vitest/coverage-v8 van a la par: por separado, npm no resuelve
          - "@testing-library/*"
          - "@playwright/*"
          - "jsdom"
      
      # Grupo para linting
      linting:
        patterns:
          - "eslint*"
      
      # Grupo para Tailwind
      tailwind:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "postcss"
      
      # Grupo para Sentry
      sentry:
        patterns:
          - "@sentry/*"
      
      # Grupo para dependencias menores
      minor-updates:
        update-types:
          - "minor"
          - "patch"
    
    # Ignorar actualizaciones major automáticas (revisar manualmente)
    ignore:
      # React 19 requiere revisión cuidadosa
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      
      # React Router 7 tiene breaking changes
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      
      # ESLint 9 tiene cambios de configuración
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      
      # Tailwind 4 está en beta
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    
    # Permitir actualizaciones solo si los tests pasan
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    # Personalizar títulos de PR para cumplir con Conventional Commits (mayúscula)
    pull-request-branch-name:
      separator: "-"

  # El comprobador de licencias del CI, fijado con su lock aparte (INF-06). Sin subir de
  # versión mayor: la 5 pide Node 24 y el CI va con la 22 del .nvmrc
  - package-ecosystem: "npm"
    directory: "/.github/license-tool"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "automated"
    ignore:
      - dependency-name: "license-checker-rseidelsohn"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"  # Seguir Gitflow: dependabot → develop → release → main
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 5 días: la ventana en que se detecta una acción comprometida (INF-12)
    cooldown:
      default-days: 5
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"

    # Personalizar títulos de PR para cumplir con Conventional Commits (mayúscula)
    pull-request-branch-name:
      separator: "-"

  # Imágenes base del Dockerfile (node y nginx), que solo usa el Kind: van fijadas por
  # digest y Dependabot propone el nuevo cada semana, que es como entran los parches
  # del sistema (INF-12). Los saltos de versión de node se suben a mano, con el .nvmrc
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
