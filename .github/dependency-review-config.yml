# Licencias que admite el frontend: lista de PERMITIDAS, no de prohibidas (#777).
# La lee Dependency Review en las PRs y también License Compliance
# (.github/scripts/license_gate.py), así que hay una sola lista.
#
# Con una lista de prohibidas, una expresión compuesta como
# "GPL-3.0 AND GPL-3.0-only" pasaba sin aviso (lo vio el backend el 28 sep 2026).
# Fuera quedan la GPL, la AGPL y también la LGPL-3.0: el código del frontend se
# distribuye al navegador (el backend sí admite la LGPL, por psycopg2).
# Es lo que hay instalado el 1 oct 2026 más Unlicense y Zlib, permisivas:
# - MPL-2.0: lightningcss (lo usa Tailwind al compilar); copyleft solo de sus ficheros
# - CC-BY-4.0: caniuse-lite (datos de navegadores, no código)
# - Python-2.0: argparse · BlueOak-1.0.0: glob, lru-cache, minimatch...
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - ISC
  - BlueOak-1.0.0
  - MPL-2.0
  - Python-2.0
  - CC-BY-4.0
  - CC0-1.0
  - Unlicense
  - Zlib

# Excepciones, paquete a paquete y con su motivo, en formato purl y sin versión:
# pkg:npm/<nombre> o pkg:githubactions/<org>/<acción>. License Compliance solo
# mira las pkg:npm/; las de acciones solo cuentan en Dependency Review.
allow-dependencies-licenses:
  # AGPL-3.0: la acción que busca secretos en el CI. Corre en el runner y no se
  # distribuye con el frontend, así que su copyleft no alcanza a este código (#857).
  - pkg:githubactions/trufflesecurity/trufflehog
  # OFL-1.1: Inter y Poppins, servidas desde la propia aplicación en vez de
  # Google Fonts (auditoría legal, 20 oct 2026). La OFL permite incrustar y
  # redistribuir las fuentes con cualquier software; solo impide venderlas
  # sueltas. Por paquete y no en la lista general: es una licencia de fuentes.
  - pkg:npm/@fontsource-variable/inter
  - pkg:npm/@fontsource/poppins
