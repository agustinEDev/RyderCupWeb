<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- El favicon claro se sirve en tema oscuro, donde el verde se pierde contra
         la barra de pestanas. El navegador se queda con la ultima coincidencia. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/icons/favicon-dark-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover lets the page extend under the status bar and the home
         indicator when installed. Without it every env(safe-area-inset-*) resolves
         to 0 and the safe-area padding across the app does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RCF" />

    <!-- Security: Content Security Policy is configured via HTTP headers in production (_headers, nginx.conf, vercel.json) -->
    <!-- This approach is more secure as meta tags cannot set frame-ancestors and are easier to bypass -->

    <meta name="description" content="RyderCupFriends - The ultimate amateur golf tournament management platform. Connect with friends, create exciting Ryder Cup format competitions, and enjoy the spirit of friendly golf competition." />
    <meta name="keywords" content="golf, ryder cup, tournament, amateur golf, golf friends, RCF, competition, golf management" />
    <meta name="author" content="RyderCupFriends Team" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="RyderCupFriends - RCF | Amateur Golf Tournament Platform" />
    <meta property="og:description" content="Connect with friends and create exciting Ryder Cup format golf tournaments" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RyderCupFriends - RCF" />
    <meta name="twitter:description" content="The ultimate amateur golf tournament management platform" />

    <title>RyderCupFriends - RCF | Amateur Golf Tournament Platform</title>
    <style>
      /* El primer instante, antes de que cargue el codigo. Se pinta lo MISMO que
         pintara React un momento despues —verde instalada, blanco en el
         navegador—, asi que el relevo no se ve.

         Y por eso retirarla es trivial: como debajo aparece la misma pantalla,
         basta quitarla cuando React monta. No hay que averiguar si ya hay
         contenido, que es lo que complico un intento anterior. */
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        /* Red de seguridad sin JavaScript: si el codigo nunca llega a cargar
           —un paquete que un despliegue borro, la red caida— esto se aparta solo
           a los 6 s en vez de dejar una pantalla fija tapandolo todo. Lo normal
           es que `main.jsx` la retire mucho antes —en una carga corriente, en
           menos de un segundo—, asi que este plazo solo se alcanza cuando algo
           ha ido mal de verdad. Corto a proposito: este mecanismo ya se quedo
           colgado una vez, y el peor caso debe ser una espera fea, no una
           aplicacion inservible. */
        animation: arranque-rendirse 0.4s ease-out 6s forwards;
      }
      @keyframes arranque-rendirse {
        to { opacity: 0; visibility: hidden; }
      }
      /* La pantalla que toma el relevo —`.pantalla-de-espera`— centra el
         monograma Y una linea de texto debajo. Esta capa centra solo el
         monograma, asi que al cambiar la una por la otra el dibujo saltaba unos
         20 px hacia arriba. Este hueco reserva exactamente lo que ocupa esa
         linea (1rem de separacion + 1.5rem de altura), de modo que el monograma
         cae en el mismo sitio en las dos y el relevo no se ve. Sin texto: el
         idioma no se sabe todavia, y una palabra en el idioma equivocado se
         nota mas que su ausencia. */
      #arranque-hueco {
        margin-top: 1rem;
        height: 1.5rem;
      }

      @media (display-mode: standalone) {
        /* El mismo verde en el documento: la franja de la barra de estado la
           pinta el fondo del `html`, no esta capa, y sin esto quedaba una banda
           blanca cruzando la parte de arriba. Repetido aqui porque este estilo
           va en linea y se aplica antes de que llegue `index.css`.
           Condicionado a que la capa siga puesta: sin esa condicion el verde se
           quedaba toda la sesion por debajo de las pantallas que no traen fondo
           propio, y ahi el texto gris no se lee. */
        html:has(#arranque) { background: #335d35; }
        #arranque { background: #335d35; }
      }
    </style>
  </head>
  <body>
    <div id="arranque" aria-hidden="true">
      <picture>
        <source media="(display-mode: standalone)" srcset="/images/rcf-monogram-white.png" />
        <img src="/images/rcf-monogram-green.png" alt="" width="88" height="78" />
      </picture>
      <div id="arranque-hueco"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
