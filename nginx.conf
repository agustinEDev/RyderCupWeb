# ==========================================
# NGINX CONFIGURATION - React SPA + Vite
# ==========================================
# Configuración optimizada para Single Page Applications
# con React Router, compresión gzip, caching y seguridad
# ==========================================

# ==========================================
# CSP: upgrade-insecure-requests solo bajo HTTPS
# ==========================================
# Este fichero se incluye dentro del contexto http, asi que el map es valido aqui.
# Detras de un proxy TLS el pod sigue recibiendo http, de ahi el primer map: manda
# X-Forwarded-Proto si viene, y si no el esquema real de la conexion.
map $http_x_forwarded_proto $csp_effective_scheme {
    default $scheme;
    https   https;
}

map $csp_effective_scheme $csp_upgrade {
    https   " upgrade-insecure-requests;";
    default "";
}

server {
    # ==========================================
    # PUERTO Y SERVER NAME
    # ==========================================
    listen 80;
    server_name localhost;

    # Directorio raíz donde están los archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # COMPRESIÓN GZIP - Reduce tamaño de archivos
    # ==========================================
    gzip on;                          # Activar compresión
    gzip_vary on;                     # Añadir header Vary: Accept-Encoding
    gzip_min_length 1024;             # Solo comprimir archivos > 1KB
    gzip_proxied any;                 # Comprimir respuestas de proxies
    gzip_comp_level 6;                # Nivel de compresión (1-9, 6 es óptimo)
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # ==========================================
    # SECURITY HEADERS - Protección básica
    # ==========================================
    # OJO: hay que repetir este include en CADA location que declare sus propios
    # add_header. nginx no acumula add_header entre niveles: el primer add_header
    # de un location descarta todos los del server (ver nginx-security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    # ==========================================
    # HEALTH CHECK - Para Kubernetes
    # ==========================================
    location /health {
        access_log off;               # No registrar health checks en logs
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ==========================================
    # PWA - SERVICE WORKER Y MANIFEST - Nunca cachear
    # ==========================================
    # Sin esto, /sw.js cae en el bloque de assets estáticos de abajo (matchea \.js$)
    # y el navegador lo cachea 1 año como immutable. Con registerType: autoUpdate,
    # el SW viejo queda servido desde cache HTTP y su manifest de precache referencia
    # chunks con hash que el siguiente deploy ya borró del dist -> 404 en el install
    # del SW -> register() rechaza sin catch (ver Sentry #132442519).
    # location = tiene prioridad sobre el regex de abajo sin importar el orden.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ==========================================
    # STATIC ASSETS - Cache agresivo
    # ==========================================
    # Archivos JS, CSS, imágenes, fuentes
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;                   # Cache por 1 año
        add_header Cache-Control "public, immutable";
        access_log off;               # No registrar assets estáticos
        include /etc/nginx/snippets/security-headers.conf;

        # Sin esto, un chunk con hash viejo que ya no existe en esta réplica
        # (típico durante un rolling update con 2+ réplicas) cae en el
        # error_page 404 /index.html; de nivel server de abajo, y nginx
        # devuelve el HTML de la SPA con código 200 en vez de un 404 real.
        # El navegador intenta parsear ese HTML como módulo JS ->
        # "Importing a module script failed" / "Failed to fetch dynamically
        # imported module" (ver Sentry: TypeError en /login y /).
        error_page 404 = @asset_404;
    }

    location @asset_404 {
        internal;
        return 404;
    }

    # ==========================================
    # SPA ROUTING - Redirigir todo a index.html
    # ==========================================
    # Esto permite que React Router maneje las rutas
    location / {
        try_files $uri $uri/ /index.html;

        # Cache corto para index.html (no queremos versiones viejas)
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ==========================================
    # API PROXY (Opcional) - Si API está en otro dominio
    # ==========================================
    # Descomenta si quieres proxear /api/* a tu backend
    # location /api/ {
    #     proxy_pass http://rydercup-api-service:80/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ==========================================
    # ERROR PAGES - Manejo de errores
    # ==========================================
    error_page 404 /index.html;       # 404 → index.html (SPA routing)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
