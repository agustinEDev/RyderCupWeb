# ==========================================
# SECURITY HEADERS - Fragmento reutilizable
# ==========================================
# Este fichero se incluye en el bloque server Y en cada location que declare
# sus propios add_header.
#
# Motivo: en nginx los add_header NO se acumulan entre niveles. Si un location
# declara aunque sea un add_header (por ejemplo Cache-Control), nginx descarta
# TODOS los heredados del server. Al tenerlos solo a nivel server, el HTML que
# sirve `location /` salia sin CSP, sin X-Frame-Options y sin HSTS, que es
# justo donde importan: CSP y frame-ancestors solo aplican al documento.
#
# Se instala en /etc/nginx/snippets/ y no en /etc/nginx/conf.d/, porque el
# nginx.conf principal de la imagen oficial hace include de conf.d/*.conf y
# cargaria este fragmento por su cuenta en contexto http.
#
# Updated: 22 Dec 2025 - Added CSP without unsafe-inline (v1.8.0)

add_header X-Content-Type-Options "nosniff" always;    # Prevenir MIME sniffing
add_header X-Frame-Options "DENY" always;              # Prevenir clickjacking
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy - Sin 'unsafe-inline' en script-src (v1.8.0)
# Updated: 03 Feb 2026 - api.rydercupfriends.com subdomain architecture
# style-src necesita 'unsafe-inline': React aplica estilos inline y framer-motion
# anima escribiendo el atributo style en runtime. Sin esto la CSP bloquea toda la
# apariencia de la app (verificado en produccion, ver #295). script-src se mantiene
# estricto, que es lo que de verdad frena un XSS: la app no tiene scripts inline.
# upgrade-insecure-requests se anade solo si la peticion llego por HTTPS (ver el
# map de $csp_upgrade en nginx.conf). Servido por HTTP, Safari reescribe TODOS los
# subrecursos a https:// —incluido en localhost, donde Chrome no lo hace— y como
# aqui no hay TLS, fallan con error de TLS y la pagina queda en blanco: el
# documento carga porque la navegacion de nivel superior no se reescribe.
# img-src incluye http://localhost:8000 por el mismo motivo que connect-src: los
# avatares y los presets se sirven desde la API (`GET /api/v1/users/{id}/avatar`),
# y en el cluster local esa API va por HTTP. Sin el origen, el navegador bloquea
# las imagenes aunque el fetch de la API si funcione.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: http://localhost:8000; connect-src 'self' https://api.rydercupfriends.com http://localhost:8000 https://o4510427294662656.ingest.de.sentry.io https://*.ingest.sentry.io; worker-src 'self' blob:; child-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none';${csp_upgrade}" always;
